name: Build Windows EXE

# Builds a standalone InstagramDMTool.exe on Windows so users can run the
# tool without installing Python. Triggers:
#   1. Manually from the Actions tab ("Run workflow")
#   2. On every push of a version tag (v*) -> exe is attached to a GitHub Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade -r requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --name InstagramDMTool --clean --noconfirm instagram_dm_tool.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: InstagramDMTool-windows
          path: dist/InstagramDMTool.exe

      - name: Attach EXE to GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InstagramDMTool.exe
          generate_release_notes: true
